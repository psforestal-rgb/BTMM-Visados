name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  consistencia:
    name: Consistencia del repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verificar consistencia (versiones, SRI, CSP, activos)
        run: python3 scripts/check_consistency.py

  nucleo-plano:
    name: Núcleo «Importar predio desde plano» (sin red)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Pruebas del núcleo determinista (parsers, geometría, CRS, área CRTM05)
        run: node scripts/plano_import.test.mjs

  smoke:
    name: Smoke test del visor (Chromium, CDN real)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Ejecutar smoke test (valida SRI contra el CDN real)
        run: node scripts/smoke_test.mjs

  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  qfield-hydro-artifact:
    name: TEMP QField hydrology artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify temporary hydrology extracts
        run: |
          test -f .tmp_qfield_hydro/Villa_Mills_caucedrenaje_25k_raw.geojson
          test -f .tmp_qfield_hydro/El_Empalme_caucedrenaje_25k_raw.geojson
          test -f .tmp_qfield_hydro/hydro_manifest.json
          ls -lh .tmp_qfield_hydro/
      - name: Upload temporary hydrology artifact
        uses: actions/upload-artifact@v4
        with:
          name: qfield-hydrology-ign25
          path: .tmp_qfield_hydro/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
          include-hidden-files: true
