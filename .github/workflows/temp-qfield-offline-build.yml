name: Temporary QField offline imagery build

on:
  push:
    branches: [temp/qfield-offline-build-20260819]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SNIT imagery endpoints
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          urls = [
            'https://geos1.snitcr.go.cr/Ortofoto2017/wmts?SERVICE=WMTS&REQUEST=GetCapabilities&VERSION=1.0.0',
            'https://geos1.snitcr.go.cr/Ortofoto2017/gwc/service/wmts?SERVICE=WMTS&REQUEST=GetCapabilities&VERSION=1.0.0',
            'https://geos1.snitcr.go.cr/Ortofoto2017/service/wmts?SERVICE=WMTS&REQUEST=GetCapabilities&VERSION=1.0.0',
            'https://geos1.snitcr.go.cr/Ortofoto2017/wms?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.1.1',
            'https://geos1.snitcr.go.cr/Ortofoto2017/wms?SERVICE=WMS&REQUEST=GetCapabilities',
          ]
          for u in urls:
            print('\n===',u,'===', flush=True)
            try:
              req=Request(u,headers={'User-Agent':'Mozilla/5.0 QGIS/3.40'})
              with urlopen(req,timeout=60) as r:
                data=r.read()
                print('status',r.status,'ct',r.headers.get('content-type'),'len',len(data),'final',r.geturl())
                print(data[:12000].decode('utf-8','replace'))
            except HTTPError as e:
              data=e.read()
              print('HTTP ERROR',e.code,'ct',e.headers.get('content-type'),'len',len(data),'final',e.geturl())
              print(data[:12000].decode('utf-8','replace'))
            except Exception as e:
              print('ERROR',repr(e))
          PY
